name: Build iOS IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify project loads
        id: verify
        run: |
          if xcodebuild -project LemonMusic.xcodeproj -scheme LemonMusic -list > /dev/null 2>&1; then
            echo "committed_project=true" >> "$GITHUB_OUTPUT"
            echo "使用仓库内 LemonMusic.xcodeproj"
          else
            echo "committed_project=false" >> "$GITHUB_OUTPUT"
            echo "::warning::预生成工程无法解析，将使用 XcodeGen"
          fi

      - name: Build with committed project
        if: steps.verify.outputs.committed_project == 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -project LemonMusic.xcodeproj \
            -scheme LemonMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LemonMusic.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
          || echo "committed_build_failed=true" >> "$GITHUB_ENV"

      - name: Fallback — generate project with XcodeGen
        if: env.committed_build_failed == 'true' || steps.verify.outputs.committed_project == 'false'
        run: |
          brew install xcodegen
          xcodegen generate
          set -o pipefail
          xcodebuild \
            -project LemonMusic.xcodeproj \
            -scheme LemonMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LemonMusic.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: bash scripts/package-ipa.sh build/LemonMusic.xcarchive build/LemonMusic.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LemonMusic-ipa
          path: build/LemonMusic.ipa
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/LemonMusic.ipa
          generate_release_notes: true
